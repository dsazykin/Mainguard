name: Package smoke (P2-48)

# Proves the packaging invariants of BOTH edition channels (Phase 3) on a real Windows publish:
#   * Pro    - the elevated helper and the MainguardOS payload are co-located with the app so first-run
#              provisioning has no "file not found" elevation/import gap.
#   * Client - the small/fast head bundles NO payload and NO elevated helper (agent-platform-free).
# A full `vpk pack` (Setup.exe, self-update, signed publisher) is the owner's release box; this smoke
# verifies everything up to it that CI CAN check.

on:
  pull_request:
    branches: [main, phase2]
    # An ALLOWLIST of paths was the wrong shape here and had already drifted: it named the two heads,
    # the shell, installer/ and build/, but not Mainguard.UI, Mainguard.Git, Mainguard.Agents or
    # Mainguard.Agents.UI — every one of which is in one or both heads' publish closures. A PR touching
    # only Mainguard.UI could break the Windows publish and get no packaging signal at all.
    #
    # Inverted to a DENYLIST: run unless the change is provably incapable of affecting a Windows publish.
    # Adding a project no longer requires remembering to widen a list; the default is now "run".
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**/*.md"
  push:
    branches: [main, phase2]

jobs:
  windows-publish-smoke:
    name: Windows publish co-location smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Stand in for the CI `payload-reproducible` artifact so the bundling target has something to copy.
      # (The real payload comes from build/mainguardos/build.sh; this smoke only checks co-location wiring.)
      - name: Stage a placeholder MainguardOS payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/mainguardos/out | Out-Null
          "smoke-placeholder" | Set-Content build/mainguardos/out/MainguardOS.tar.gz

      - name: Publish Mainguard.Pro.App (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish Mainguard.Pro.App/Mainguard.Pro.App.csproj -c Release -r win-x64 --self-contained true
          -o artifacts/publish/Mainguard
          /p:MainguardOsPayload=${{ github.workspace }}/build/mainguardos/out/MainguardOS.tar.gz

      - name: Assert elevated helper + payload + elevated stage are co-located and app version-stamps
        shell: pwsh
        run: |
          $dir = "artifacts/publish/Mainguard"
          $helper = Join-Path $dir "Mainguard.Installer.Elevated.exe"
          $payload = Join-Path $dir "payload/MainguardOS.tar.gz"
          $app = Join-Path $dir "Mainguard.Pro.App.exe"
          # MG-15: the elevated-components STAGE is what gets promoted into %ProgramFiles%\Mainguard\elevated
          # behind the OOBE's UAC prompt. Without it the app falls back to launching the helper out of the
          # per-user install directory — the escalation this release removed. pack.ps1 asserts this, but
          # pack.ps1 runs on the owner's release box; until now nothing in CI checked it, and the MSBuild
          # target that produces the stage only warned when it came out empty. Assert it here, where every
          # PR sees it.
          $stage = Join-Path $dir "elevated-stage/Mainguard.Installer.Elevated.exe"
          if (-not (Test-Path $helper))  { throw "MISSING elevated helper: $helper" }
          if (-not (Test-Path $payload)) { throw "MISSING bundled payload: $payload" }
          if (-not (Test-Path $app))     { throw "MISSING app exe: $app" }
          if (-not (Test-Path $stage))   { throw "MISSING elevated-components stage: $stage — the packaged app cannot relocate the elevated helper out of %LocalAppData% (MG-15)." }
          # An EMPTY stage is the same failure with a directory in front of it: the stage carries the
          # helper's whole self-contained closure, so a handful of files means the publish did not land.
          $stageFiles = @(Get-ChildItem (Join-Path $dir "elevated-stage") -Recurse -File)
          Write-Host "Elevated stage files: $($stageFiles.Count)"
          if ($stageFiles.Count -lt 10) {
            throw "Elevated-components stage has only $($stageFiles.Count) files — a self-contained publish of the helper is far larger; the stage did not land (MG-15)."
          }
          $v = (Get-Item $app).VersionInfo
          Write-Host "App FileVersion:     $($v.FileVersion)"
          Write-Host "Helper FileDescription (UAC name): $((Get-Item $helper).VersionInfo.FileDescription)"
          if ((Get-Item $helper).VersionInfo.FileDescription -ne "Mainguard Setup") {
            throw "Elevated helper UAC name is not 'Mainguard Setup' — got '$((Get-Item $helper).VersionInfo.FileDescription)'"
          }
          Write-Host "Package co-location smoke PASSED."

  windows-client-publish-smoke:
    name: Windows client publish (small, agent-platform-free) smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Client head references Mainguard.App.Shell ONLY (no OOBE), so a plain publish is the whole story:
      # no placeholder payload is staged, because the Client channel must bundle none.
      - name: Publish Mainguard.Client.App (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish Mainguard.Client.App/Mainguard.Client.App.csproj -c Release -r win-x64 --self-contained true
          -o artifacts/publish/Mainguard.Client

      - name: Assert the Client install is small - NO payload, NO elevated helper
        shell: pwsh
        run: |
          $dir = "artifacts/publish/Mainguard.Client"
          $app = Join-Path $dir "Mainguard.Client.App.exe"
          if (-not (Test-Path $app)) { throw "MISSING app exe: $app" }
          if (Test-Path (Join-Path $dir "payload")) {
            throw "Client head must NOT bundle a MainguardOS payload, but payload/ exists in the publish."
          }
          if (Test-Path (Join-Path $dir "Mainguard.Installer.Elevated.exe")) {
            throw "Client head must NOT co-locate the elevated helper (it has no OOBE/UAC hand-off)."
          }
          $v = (Get-Item $app).VersionInfo
          Write-Host "Client App FileVersion: $($v.FileVersion)"
          $sizeMb = [math]::Round(((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "Client publish size: $sizeMb MB"
          Write-Host "Client publish smoke PASSED (no payload, no elevated helper)."

  # ---------------------------------------------------------------------------------------------------
  # pack.ps1 is the release script, and until now it appeared in NO workflow — not even -DryRun. Every
  # invariant it owns (the MG-15 elevated-stage assertion, the signing-pin derivation, the two-channel
  # packId/feed split) was therefore manual-only: it could break at any commit and only be discovered on
  # the owner's release box at release time. -DryRun resolves the full per-channel plan and runs nothing,
  # so it is exactly the part CI can exercise without `vpk`, a payload or a certificate.
  #
  # ubuntu-latest: `-DryRun` executes no Windows tooling, and pwsh is preinstalled — this costs 1x
  # minutes rather than the 2x a windows runner bills.
  # ---------------------------------------------------------------------------------------------------
  velopack-wiring:
    name: Velopack channel wiring (pack.ps1 -DryRun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve both channel plans
        shell: pwsh
        run: |
          # `*>&1`, not `2>&1`: pack.ps1 reports through Write-Host, which goes to the INFORMATION
          # stream — a `2>&1` capture would come back empty and this check would test nothing.
          foreach ($channel in @('client', 'pro')) {
            Write-Host "===================== $channel ====================="
            $out = (& "$PWD/build/velopack/pack.ps1" -Channel $channel -DryRun *>&1 | Out-String)
            Write-Host $out
            if ($out -notmatch 'Plan resolved for channel') {
              throw "pack.ps1 -Channel $channel -DryRun did not resolve a plan."
            }
          }
          Write-Host "Both Velopack channel plans resolve."

      # Regression guard for the -DryRun secret leak: the mode documented as "verify the wiring safely"
      # used to echo /p:MainguardSigningCertPassword=<pw> and signtool's /p "<pw>" verbatim. A canary
      # password goes in; if it comes out in ANY line of output, this fails.
      - name: -DryRun must never print the signing password
        shell: pwsh
        run: |
          $canary = 'CANARY-SIGNING-PASSWORD-DO-NOT-PRINT'
          $out = (& "$PWD/build/velopack/pack.ps1" -Channel pro -DryRun `
                    -SigningCertPath '/nonexistent/mainguard.pfx' `
                    -SigningCertPassword $canary `
                    -PinnedThumbprints 'DEADBEEFDEADBEEFDEADBEEFDEADBEEFDEADBEEF' *>&1 | Out-String)
          Write-Host $out
          if ($out -match [regex]::Escape($canary)) {
            throw "pack.ps1 -DryRun printed the signing certificate password. Redact it before printing the command."
          }
          if ($out -notmatch 'REDACTED') {
            throw "pack.ps1 -DryRun printed neither the password nor a redaction marker — the signing arguments are not reaching the printed plan, so this guard is not testing anything."
          }
          Write-Host "-DryRun kept the signing password out of its output."
