name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the SDK version pinned in global.json (10.0.100).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Verifies code matches .editorconfig. If this fails on an untouched file,
      # run `dotnet format` locally once, commit the result, then re-run.
      - name: Verify formatting
        run: dotnet format --verify-no-changes

  # main is the branch mainguard.dev deploys from, and until now nothing under site/ was compiled
  # or checked on a PR — deploy-site.yml only runs on push to main, i.e. after the merge. A broken
  # site was therefore only discoverable once it was already live.
  #
  # Deliberately NO `paths:` filter. A path filter is how a guard silently stops running.
  site:
    name: Site builds & copy keeps its voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (locked)
        working-directory: site
        run: npm ci

      # `npm run build` is `tsc -b && vite build`: the type check AND the bundle, the same command
      # deploy-site.yml runs. A PR that breaks either fails here instead of on main.
      - name: Build (tsc -b + vite build)
        working-directory: site
        run: npm run build

      - name: Lint
        working-directory: site
        run: npx oxlint

      # The copy was rewritten once to strip em dashes and stock marketing phrasing, and nothing
      # stopped the next edit from putting it back. Copy drift is invisible to tsc and to the
      # bundler. /privacy and /terms are exempt: their register is legal, not marketing.
      - name: Marketing copy keeps its voice
        run: node build/ci/check-site-copy.mjs
