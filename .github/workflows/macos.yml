# =================================================================================================
# The macos-host substrate leg: build + the non-Docker test tier on an Apple Silicon runner.
# =================================================================================================
# PROMOTED INTO THE PR MATRIX. This file used to trigger on `workflow_dispatch` and pushes to
# `port/macos` only, with a header saying "promote it into the PR matrix when the port merges". The
# port merged; the promotion never happened. Its last run was 2026-08-25, which meant that for
# months there was no macOS signal on any pull request at all — and, specifically, that the three
# `[MacOnlyFact]` tests (`AgentEnvironmentFactoryTests.MacHost_*`,
# `SubstrateConformanceTests.GitObjectsRoundTrip_ShouldBeByteIdentical`) ran NOWHERE. A test that
# only ever skips is reported green forever, which is the shape this repo keeps being bitten by.
#
# The triggers below now mirror `ci.yml` exactly — same `pull_request` base-branch list (including
# `feat/**` / `fix/**`, so a STACKED pr still gets a macOS check rather than reporting zero), same
# `push` list, same concurrency group shape.
#
# ON THE SPEND, WHICH IS THE REASON IT WAS DEFERRED
# -------------------------------------------------
# GitHub bills macOS runner minutes at 10x Linux, so this is a deliberate cost decision, not an
# oversight being corrected for free. Two things keep it bounded:
#   * the leg runs the NON-DOCKER tier only (see below) — it is not a second full CI;
#   * the NuGet package cache below is why this file diverges from `ci.yml`, which has none: at 10x
#     billing a cold ~1.7 GB restore on every PR is the single largest avoidable cost here.
# `timeout-minutes: 45` is the ceiling; a hung leg cannot quietly burn six hours of 10x minutes.
#
# WHAT THIS LEG DOES NOT COVER — THE 127 RequiresDocker TESTS
# -----------------------------------------------------------
# The whole `Category=RequiresDocker` tier (127 tests: container hardening, default-deny egress, the
# A6 git proxy, G2 key custody, the merge-queue end-to-end suite) runs ONLY on `ubuntu-latest`, in
# `ci.yml`'s `sandbox-security` job. It is filtered out here, and that is not a temporary gap that a
# later PR closes: GitHub's hosted macOS runners ship no container engine and cannot run Linux
# containers (no nested virtualisation, no Docker Desktop), so there is no version of this job that
# could run them. The same is true of a hosted Windows runner for LINUX containers.
#
# So the honest statement of coverage is: the Docker-backed sandbox/security evidence is
# LINUX-ENGINE-ONLY. The macOS engine's evidence is the on-device run recorded in
# docs/phase-2/Mainguard_Substrate_MacHost.md, and the Windows engine's is WSL2, which no hosted
# runner reproduces either. Closing that for real needs a self-hosted macOS runner or an on-device
# matrix — not a job here that would fail on its first line.
# =================================================================================================
name: macOS

on:
  # Mirrors ci.yml. 'feat/**' / 'fix/**' so a STACKED pr — one whose base is another feature branch
  # rather than a long-lived one — still gets a macOS check instead of reporting zero checks.
  # For pull_request, the branches filter matches the BASE branch.
  pull_request:
    branches: [main, phase2, 'feat/**', 'fix/**']
  push:
    branches: [main, phase2]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR. At 10x billing this matters more here than anywhere.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

# WHAT THE PROMOTION MEASURED, AND THE ONE KNOWN FLAKE
# -----------------------------------------------------
# Measured across the two PR runs that promoted this file, so the numbers are observations, not
# estimates:
#
#   Mainguard.Tests         4026 tests — 4016 passed, 10 skipped, 0 failed  (~20 min)
#   Mainguard.Server.Tests   874 tests —  865 passed,  9 skipped, 0 failed  (~9 min)
#   Daemon --local-dev smoke: green.
#
# And the point of the promotion: all three [MacOnlyFact] tests EXECUTED and PASSED for the first
# time — AgentEnvironmentFactoryTests.MacHost_SyncRemote_ShouldBeTheLocalBarePath,
# AgentEnvironmentFactoryTests.MacHost_Toolchains_ShouldInstallViaContainers_AndMountTheMacRoot, and
# SubstrateConformanceTests.GitObjectsRoundTrip_ShouldBeByteIdentical.
#
# The leg is therefore a REAL GATE — no `continue-on-error`. One caveat is worth writing down rather
# than discovering twice: the earlier of the two runs failed on
# `SpawnWatchdogWiringTests.LaunchProgressDeltas_KeepASpawnAliveWellPastTheSilenceBudget`, which
# passed on the re-run. It is an INTERMITTENT timing flake, not a macOS defect — the test sets a
# 300 ms silence budget and beats the watchdog every 40 ms, so a cold first iteration (JIT + timer
# granularity on a loaded hosted runner) can overshoot and the spawn is cancelled. It should be made
# time-independent; until then expect an occasional red here. The Linux `build-and-test` gate carries
# a flake of the same species (`PromptDeliveryBinderTests.WhenTheEchoWaitReturnsInstantly_...`) and is
# blocking anyway, so weakening THIS leg for a flake both platforms share would be inconsistent as
# well as unearned.
jobs:
  mac-build-and-test:
    name: Build & non-Docker tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # MG-35: global.json pins the SDK to an EXACT build, so this runner uses the same compiler,
      # analyzers and runtime packs as the Linux leg. Identical to ci.yml's step.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NOT in ci.yml, deliberately: see the spend note in the header. Keyed on the committed
      # lockfiles, which are exactly what --locked-mode restores from, so a stale cache is
      # impossible — a lockfile edit changes the key.
      - name: Cache the NuGet package closure (macOS minutes bill at 10x)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-macos-

      # MG-35: --locked-mode restores ONLY what the committed packages.lock.json already names, so a
      # transitive that drifted between review and merge fails here (NU1004/NU1403) instead of
      # entering the product. The osx-arm64 RID section is committed for these projects precisely so
      # this binds on a Mac (see CLAUDE.md § lockfiles).
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # P2-18: the pinned libvterm, .dylib lane (same script, same pinned source + sha256 as the
      # Linux leg). MAINGUARD_REQUIRE_LIBVTERM turns a missing library into a hard test failure, so
      # the libvterm legs can never silently skip on macOS either.
      - name: Build pinned libvterm (P2-18 engine, .dylib lane)
        run: bash build/libvterm/build.sh

      # --filter "Category!=RequiresDocker" is what makes this a bounded leg rather than a second
      # full CI. Everything else runs, which is what gets the three [MacOnlyFact] tests executed.
      - name: Test — Mainguard.Tests (non-Docker)
        env:
          MAINGUARD_LIBVTERM: ${{ github.workspace }}/build/libvterm/out/libvterm.dylib
          MAINGUARD_REQUIRE_LIBVTERM: "1"
        run: >
          dotnet test Mainguard.Tests/Mainguard.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --filter "Category!=RequiresDocker"

      # The [MacOnlyFact] tests live here (Agents/AgentEnvironmentFactoryTests.cs,
      # Agents/SubstrateConformanceTests.cs). SubstrateConformanceTests is deliberately split in two
      # classes so the round-trip row keeps its own class WITHOUT the RequiresDocker trait — if it
      # ever gains that trait the filter above would exclude it and the mac row would go quiet again.
      # `!cancelled()` is load-bearing, and its absence was a real defect in the first version of this
      # promotion: a failing step aborts the rest, so the FIRST run stopped at Mainguard.Tests (one
      # flaky test) and this step — the one holding all three [MacOnlyFact] tests, i.e. the entire
      # point of promoting this leg — never ran at all.
      - name: Test — Mainguard.Server.Tests (non-Docker, incl. every [MacOnlyFact])
        if: ${{ !cancelled() }}
        env:
          MAINGUARD_LIBVTERM: ${{ github.workspace }}/build/libvterm/out/libvterm.dylib
          MAINGUARD_REQUIRE_LIBVTERM: "1"
        run: >
          dotnet test Mainguard.Server.Tests/Mainguard.Server.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --filter "Category!=RequiresDocker"

      - name: Daemon --local-dev smoke (macos-host substrate composition)
        if: ${{ !cancelled() }}
        run: dotnet run --project Mainguard.Server -c Release --no-build -- --local-dev --smoke
