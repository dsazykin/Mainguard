syntax = "proto3";

package mainguard.v1;

option csharp_namespace = "Mainguard.Protos.V1";

// The agent lifecycle surface. Bodies are minimal in P2-02 (skeleton); the real
// spawn/attach/verify machinery lands in P2-06/P2-09. StreamAgentEvents is
// designed snapshot-then-deltas so a reconnecting client converges trivially.
service AgentService {
  rpc SpawnAgent(SpawnAgentRequest) returns (SpawnAgentResponse);
  // Give a STRANDED merge-queue entry a live jail again: spawn onto the agent id that entry already
  // has, with the new worktree standing on its existing `agent/<id>` branch and its commits intact, so
  // the entry can be verified and merged instead of only discarded. A stopped/crashed agent leaves its
  // queue entry behind and verification runs only in the worker's own jail, so before this the only
  // offered action on such an entry was to throw the work away.
  //
  // This is a SEPARATE RPC rather than an agent_id field on SpawnAgentRequest, and separate for two
  // reasons that are both enforcement:
  //   * `RoleInterceptor` denies by METHOD. A whole method can be put on the coordinator denial list;
  //     a field inside a shared message cannot, and adoption is strictly more dangerous than the merge
  //     power §4 already denies — an agent that could adopt an arbitrary id could hijack another
  //     agent's entry, write its branch, and have the daemon verify the result.
  //   * There is deliberately no `role` field. A resume can therefore never mint a coordinator or a
  //     managed session; it always produces a plain one, by construction rather than by validation.
  // As with DiscardEntry there is also no actor field: the resuming identity is derived daemon-side.
  rpc ResumeAgent(ResumeAgentRequest) returns (ResumeAgentResponse);
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  // Harvest a LIVE agent's CLI login-state WITHOUT stopping it. The jail's $HOME is tmpfs and the
  // durable store is the host OS keychain, but harvest previously ran only inside StopAgent — so a
  // daemon shutdown, VM stop, or crash lost the login and the user had to sign in again on every
  // launch. The client polls this while an agent runs and on app shutdown, then persists to the
  // keychain exactly as it does for a stop. Read-only: the agent keeps running and nothing is wiped.
  rpc HarvestAgentCredentials(HarvestAgentCredentialsRequest) returns (HarvestAgentCredentialsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc StreamAgentEvents(StreamAgentEventsRequest) returns (stream AgentEvent);
  // The dynamically installed agent CLIs the daemon can launch (the VM-side
  // InstalledAdapterCatalog view). No paths, no secrets — ids/versions only (G-14).
  rpc ListInstalledAdapters(ListInstalledAdaptersRequest) returns (ListInstalledAdaptersResponse);
  // Tier-1 daemon fast-path (skew probe): the daemon's own version plus the MainguardOS
  // payload version stamped in /etc/mainguardos-release. A daemon that predates this RPC
  // answers Unimplemented — which the client treats as the skew signal itself.
  rpc GetDaemonInfo(GetDaemonInfoRequest) returns (GetDaemonInfoResponse);
  // Live per-agent CPU/RAM sampled from the container engine, plus whether each agent's spend
  // is measurable at all. The Resource Monitor was built over this data and it did not exist:
  // the client hard-coded CPU/RAM to 0, so the tab showed a convincing zero for every agent
  // forever. Sampling is driven by the subscription — no subscriber, no engine calls.
  rpc StreamAgentResources(StreamAgentResourcesRequest) returns (stream AgentResourcesSnapshot);
}

message SpawnAgentRequest {
  string repo_handle = 1;   // opaque handle, never a daemon filesystem path (G-14)
  string task_prompt = 2;
  string agent_kind = 3;    // adapter id, e.g. "claude-code"
  string model_api_key = 4; // SECRET
  // The orchestration role of this session: "" (manual), "coordinator" (gets the
  // daemon-mediated spawn tool in its jail), or "managed" (coordinator-spawned worker;
  // its terminal input is daemon-locked per P2-14).
  string role = 5;
  // The user's CUSTOM env-var keys (llm_env_* keystore entries — BYOK for multi-provider
  // CLIs like opencode that declare no apiKeyEnvVar). Injected into the agent env-file next
  // to model_api_key; names must be valid env identifiers, values are SECRET.
  repeated EnvEntry extra_env = 6;
  // The CLI's saved login state (OAuth tokens etc.) from the HOST OS keychain, restored into
  // the jail's tmpfs $HOME at boot so interactive logins survive relaunches. The daemon only
  // writes paths the installed adapter DECLARES (credentialPaths) and only where no fresher
  // in-jail copy exists. Contents are SECRET; nothing persists agent-side (the home is tmpfs).
  repeated CliCredentialFile cli_credentials = 7;
  // The CLI's saved SETTINGS FOR THIS REPOSITORY — above all the permission allowlist the user built
  // by approving commands in earlier agents — restored into the jail's throwaway trees so a new agent
  // does not re-prompt for everything already allowed. NOT secrets and NOT keychain-backed: the
  // durable copy is an ordinary per-repo JSON file under the Mainguard data root that the owner can
  // read and delete. Scope is per repository on purpose (an approval in repo A must not pre-approve
  // the same command in repo B), and an UNTRUSTED spawn (external pull request) sends none at all.
  repeated CliSettingsFile cli_settings = 8;
}

// One CLI settings file. Unlike CliCredentialFile this carries a ROOT, because a CLI keeps its
// user-level and project-level configuration in two different trees and BOTH are wiped every spawn:
//   "home"       -> the jail's tmpfs $HOME
//   "workspace"  -> the per-agent git worktree, where claude-code records "don't ask again" grants
// The daemon accepts an entry only when the installed adapter declares that exact (root, path).
message CliSettingsFile {
  string root = 1;    // "home" | "workspace" — an unknown value is refused, never defaulted
  string path = 2;    // root-relative, validated against the adapter's declared settingsPaths
  bytes content = 3;
}

// One CLI login-state file, addressed relative to the jail's $HOME (e.g.
// ".claude/.credentials.json"). Content is SECRET — it exists on the wire only to move
// between the host OS keychain and the jail's tmpfs home; neither side stores it on disk.
message CliCredentialFile {
  string path = 1;    // $HOME-relative, validated against the adapter's declared credentialPaths
  bytes content = 2;  // SECRET
}

// One SECRET environment entry for the agent env-file (never container Env/argv).
message EnvEntry {
  string name = 1;
  string value = 2; // SECRET
}

message SpawnAgentResponse {
  string agent_id = 1;
}

message ResumeAgentRequest {
  string repo_handle = 1;   // opaque handle, never a daemon filesystem path (G-14)
  // The EXISTING entry to adopt. Scoped to repo_handle and validated against that repo's live merge
  // queue: agent ids are unique per repo and NOT globally (the external-PR intake names entries
  // `pr-<n>`, so two subscribed repositories both hold a `pr-7`), so the daemon keys every check on
  // the (repo, agent) pair. An id naming no entry in this repo's queue is refused.
  string agent_id = 2;
  // Which CLI to run in the resumed jail. The queue entry does not record the kind that produced the
  // branch (MergeQueueRow holds no such column), so this is the human's choice at resume time exactly
  // as it is at spawn time — asked rather than guessed.
  string agent_kind = 3;
  string model_api_key = 4; // SECRET
  // The user's CUSTOM env-var keys and the CLI's saved login state — identical payloads to
  // SpawnAgentRequest.extra_env / .cli_credentials, and redacted by the same registrations
  // (EnvEntry.value, CliCredentialFile.content), so a resume masks exactly what a spawn masks.
  // Values are SECRET; the field lines deliberately carry no trailing `// SECRET` marker, for the
  // same reason SpawnAgentRequest's do not — the secrecy lives on the nested message's own field.
  repeated EnvEntry extra_env = 5;
  repeated CliCredentialFile cli_credentials = 6;
  // No `role`, and no actor — see the RPC comment.
}

message ResumeAgentResponse {
  // False for every refusal, which is an ordinary successful RPC and NOT an error: "the branch is
  // gone", "this entry already has a live agent", "a merge is in progress" are states of the world the
  // human has to read. A caller must therefore never treat "no exception" as evidence that anything
  // was resumed.
  bool resumed = 1;
  string reason = 2;   // rendered verbatim when resumed is false
  string agent_id = 3; // the SAME id that was adopted — never a newly minted one
  string branch = 4;   // agent/<id>, the branch the resumed jail's worktree stands on
  string state = 5;    // the entry's WorkerMergeState after the resume
  // True when the entry was sitting at `Verifying` with no run behind it and the resume walked it back
  // to `Working`. Surfaced rather than hidden: the entry's state changed as a side effect of an action
  // asked for a different reason, and a stale "verifying" claim must not be left standing for a jail
  // that no longer existed.
  bool cleared_stalled_verification = 6;
}

message StopAgentRequest {
  string agent_id = 1;
}

message StopAgentResponse {
  bool stopped = 1;
  // The CLI's login-state files harvested from the jail's tmpfs $HOME just before teardown
  // (the adapter's declared credentialPaths), so the client can persist them into the HOST
  // OS keychain — the only durable store (agent-side is tmpfs by design). SECRET contents.
  repeated CliCredentialFile cli_credentials = 2;
  // The stopped session's adapter kind, so the client knows which keychain entry to update.
  string agent_kind = 3;
  // The CLI's settings harvested from the jail (the adapter's declared settingsPaths), for the
  // client to fold into its PER-REPO settings file. EMPTY for an unattended session — a Managed
  // worker's terminal is daemon-locked read-only, so nothing in its allowlist was approved by a
  // person, and letting it flow back would be an agent writing its own future permissions.
  repeated CliSettingsFile cli_settings = 4;
  // The repo handle this session belongs to — the SAME opaque handle the client supplied on spawn
  // (never a daemon path, G-14). Settings are stored per repository, and the client's harvest sweep
  // walks every agent on the daemon, not just the open repo's: without this the client would have to
  // assume "whatever repo is open right now", which is exactly how one repo's approved-command list
  // would end up filed under another. Empty when the session has no repo.
  string repo_handle = 5;
}

message HarvestAgentCredentialsRequest {
  string agent_id = 1;
}

message HarvestAgentCredentialsResponse {
  // The CLI's CURRENT login-state files (the adapter's declared credentialPaths), read out of the
  // live jail. Empty when the agent has no jail, no declared credential paths, or has not logged in
  // yet — an empty result is normal and must never clobber a good keychain entry. SECRET contents.
  repeated CliCredentialFile cli_credentials = 1;
  // The adapter kind, so the client knows which keychain entry to update.
  string agent_kind = 2;
  // The CLI's CURRENT settings (the adapter's declared settingsPaths), so the periodic sweep keeps
  // the per-repo store warm and a crash does not cost the approvals made this session. Empty for an
  // unattended session, for the same reason as StopAgentResponse.cli_settings.
  repeated CliSettingsFile cli_settings = 3;
  // The repo handle this session belongs to (see StopAgentResponse.repo_handle) — what makes the
  // client's per-repo filing exact instead of a guess at the currently open repository.
  string repo_handle = 4;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message StreamAgentEventsRequest {}

// Immutable per-agent snapshot the daemon exposes to the client. No paths (G-14).
message AgentInfo {
  string agent_id = 1;
  string agent_kind = 2;
  string state = 3;
  string role = 4; // "", "coordinator", or "managed" (see SpawnAgentRequest.role)
}

message ListInstalledAdaptersRequest {}

// One dynamically installed agent CLI (a registry marker the daemon can launch).
// api_key_env_var is the VARIABLE NAME the CLI reads its key from (e.g.
// ANTHROPIC_API_KEY) — never a key value; empty = interactive login only.
message InstalledAdapterInfo {
  string id = 1;      // the agentKind, e.g. "claude-code"
  string version = 2; // the pinned, installed version
  string api_key_env_var = 3;
}

message ListInstalledAdaptersResponse {
  repeated InstalledAdapterInfo adapters = 1;
}

message GetDaemonInfoRequest {}

// Versions only — no paths, no secrets (G-14).
message GetDaemonInfoResponse {
  // The Mainguard.Server assembly informational version this daemon was built as.
  string daemon_version = 1;
  // MAINGUARDOS_VERSION from /etc/mainguardos-release inside the VM; "" when the file is absent
  // (e.g. a --local-dev daemon on Windows).
  string payload_version = 2;
}

// Snapshot-then-deltas: the daemon sends exactly one AgentEvent{snapshot} at the
// head of every subscription, then streams state/log deltas. A reconnecting
// client resyncs from the fresh snapshot with no server-side cursor.
message AgentEvent {
  string agent_id = 1;
  uint64 seq = 2;
  oneof event {
    AgentSnapshot snapshot = 3;
    StateChange state = 4;
    LogLine log = 5;
  }
}

message AgentSnapshot {
  repeated AgentInfo agents = 1;
}

message StateChange {
  string state = 1;
  // Human-readable reason for the transition, when there is one (e.g. a Dead CLI's exit
  // code + last output tail). Empty for ordinary transitions. The App surfaces it — and runs
  // the egress block-detector on it — so a CLI that died on a blocked host can prompt an unblock.
  string reason = 2;
}

message LogLine {
  string line = 1;
}

message StreamAgentResourcesRequest {}

// One sampling tick, as a WHOLE-SET snapshot rather than per-agent deltas: an agent that
// stopped reporting must be expressible, and a delta feed can only ever add. The client
// replaces its map with each snapshot, so a torn-down agent's stale numbers cannot linger.
message AgentResourcesSnapshot {
  repeated AgentResourceReading agents = 1;
}

// One agent's sampled usage.
//
// cpu_percent and mem_bytes are `optional` ON PURPOSE. proto3 scalars default to 0, and a 0
// that means "we could not measure it" is indistinguishable from a 0 that means "this agent is
// idle" — which is precisely the false-reassurance bug this RPC exists to fix. Explicit field
// presence makes "unknown" a value the wire format can carry, so the client never has to guess.
message AgentResourceReading {
  string agent_id = 1;
  // Percent of ONE core (the `docker stats` convention): a container pinning two cores reads 200.
  optional double cpu_percent = 2;
  // Resident bytes, page-cache excluded the way `docker stats` does it.
  optional double mem_bytes = 3;
  // Whether this agent's model spend is MEASURABLE — i.e. the daemon issued it a gateway
  // confinement token at spawn, so its traffic transits the metering proxy. False for an OAuth
  // agent (it authenticates past the proxy with a session Mainguard never issued), for a BYOK
  // CLI that declares no base-URL/model-host pair (codex, qwen-code, opencode), and for a daemon
  // running with the gateway off. When false the client must not render a spend figure at all —
  // "$0.00" would read as "you have spent nothing". See docs/design/oauth-budgeting.md.
  bool metered = 4;
  // Why a reading is absent, for the daemon log and diagnostics. Never rendered as a number.
  string unavailable_reason = 5;
}
