syntax = "proto3";

package mainguard.v1;

option csharp_namespace = "Mainguard.Protos.V1";

// Plan-approval + dual-mode orchestration surface: the coordinator chat bridge, the worker-authored
// TaskPlan approval RPCs, and the kill switch.
//
// SECURITY (SA-1/F2 — binding): there is deliberately NO client-supplied approver / osIdentity field
// anywhere in this file. The recorded approver is derived daemon-side from the authenticated
// connection's OS peer credential — a client cannot influence it. Adding such a field is a rejection.

// The human plan-approval surface. In phase 2 the plan on the card is the WORKER's: the coordinator
// spawns freely within the caps, and each worker inspects its repository, authors its own plan, presents
// it and BLOCKS until this surface decides. Approve carries ONLY the plan id — the approver identity is
// daemon-derived (SA-1/F2). Reject is not terminal: its reason is FEEDBACK the worker revises against,
// bounded by the daemon-side MaxPlanRevisions, after which the worker escalates.
// BeginMerge/ConfirmMerge live on MergeQueueService and are denied to the coordinator role by the
// RoleInterceptor (they are NOT reachable from this surface).
service PlanApprovalService {
  // Snapshot-then-deltas of the pending + recently-decided plans.
  rpc StreamPlans(StreamPlansRequest) returns (stream PlanUpdate);
  // Approve a pending plan. NO identity field — the approver is the connection's OS peer credential.
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
  // Send a plan back to its worker with feedback. The worker revises and re-presents.
  rpc RejectPlan(RejectPlanRequest) returns (RejectPlanResponse);
  // Ask an ESCALATED worker for one fresh plan, with guidance (owner decision, 2026-09-03). Escalation
  // is otherwise terminal; this is the one human act that reopens it, once. Denied to the coordinator
  // role by the RoleInterceptor — it is a plan decision, on exactly the ApprovePlan/RejectPlan boundary.
  rpc RequestNewPlan(RequestNewPlanRequest) returns (RequestNewPlanResponse);

  // The operator's PLAN-MODE TOGGLE. On (the default) is the model above. Off means a delegated worker
  // is given its task at spawn and no plan is authored, presented or reviewed.
  //
  // SetPlanMode is denied to the coordinator role by the RoleInterceptor, on exactly the boundary that
  // denies it ApprovePlan: an agent that could turn the gate off would hold the gate it is denied at,
  // and would hold it for every future worker rather than for one plan.
  rpc GetPlanMode(GetPlanModeRequest) returns (PlanModeState);
  rpc SetPlanMode(SetPlanModeRequest) returns (PlanModeState);
}

message GetPlanModeRequest {}

message SetPlanModeRequest {
  bool enabled = 1;
}

message PlanModeState {
  bool enabled = 1;
  // The daemon's own sentence for this state, rendered daemon-side so the surface a human reads and the
  // gate that refuses the coordinator cannot disagree about what is on.
  string summary = 2;
}

message StreamPlansRequest {
  string coordinator_id = 1; // optional filter; empty = all coordinators
}

message PlanUpdate {
  repeated PlanEntry plans = 1;
  string pressure_signal = 2; // the "N plans pending" fact line, or empty

  // BACKPRESSURE (contract §2 — a requirement, not a nicety). A worker blocked on plan approval counts
  // against MaxActiveWorkers, so a saturated cap means the coordinator has stopped spawning. The UI must
  // be able to SAY that ("6 workers waiting on your approval") rather than going quiet, because a silent
  // stall is indistinguishable from a hang.
  int32 blocked_worker_count = 3;    // workers currently held at the plan gate
  int32 escalated_worker_count = 4;  // workers that spent the revision budget and stopped
  int32 active_worker_count = 5;     // the population counted against the cap
  int32 max_active_workers = 6;      // CoordinatorLimits.MaxActiveWorkers
  int32 max_plan_revisions = 7;      // CoordinatorLimits.MaxPlanRevisions
  string backpressure_signal = 8;    // the rendered fact line, or empty when there is nothing to say

  // The plan-mode toggle, carried on the same stream the approval cards arrive on. A human looking at an
  // EMPTY plan gate has two possible explanations — nothing is running, or approvals are off — and only
  // the daemon can tell them apart. Carried rather than re-derived client-side for the §2.6 reason: a
  // surface that disagrees with its gate is how somebody comes to believe they still have an approval
  // step they switched off.
  bool plan_mode_enabled = 9;
  string plan_mode_summary = 10;
}

message PlanEntry {
  string plan_id = 1;
  string coordinator_id = 2;
  string title = 3;
  repeated string scope = 4;    // the load-bearing field (SA-1/F6 compares diffs against it)
  string approach = 5;
  string test_strategy = 6;
  string status = 7;            // PlanStatus name: Pending/Approved/Rejected/Escalated/Superseded
  double budget_usd = 8;
  // The daemon-derived approver identity, present only on an approved plan (SA-1/F2). This is an
  // OUTPUT field the daemon fills — never a client input.
  string approver_identity = 9;

  // Phase 2: authorship and the revise loop.
  string worker_agent_id = 10;   // the worker that inspected the repo and wrote this plan
  int32 revision = 11;           // 0 = the original presentation
  int32 revisions_remaining = 12;// revisions still permitted before the worker must escalate
  string rejection_feedback = 13;// the human's most recent rejection text (what the worker revises against)

  // Phase 3: the re-scope. A worker that discovers mid-task it needs a file its approved scope does not
  // cover presents a WIDER plan against the approval it already holds, and a human decides it like any
  // other. These three fields are what make that card a different decision from a first presentation:
  // the human is approving a WIDENING of something they already said yes to, and cannot judge it without
  // seeing what changed.
  string supersedes_plan_id = 14;// the approved plan this one asks to replace; empty on an ordinary plan
  repeated string previous_scope = 15; // that plan's scope, copied when the re-scope was presented, so
                                       // the card diffs against what was actually consented to
  int32 rescope_count = 16;      // how many widenings this worker has already had approved (visibility,
                                 // not a budget — nothing refuses on this number)
  bool new_plan_requested = 17;  // an escalated plan a human has sent back for one fresh plan
}

message ApprovePlanRequest {
  string plan_id = 1;
  // NOTE: no approver / os_identity field by design (SA-1/F2). The daemon derives it.
}

message ApprovePlanResponse {
  bool approved = 1;
  string approver_identity = 2; // echoed back for the UI's decided-card tooltip (daemon-derived)
}

message RejectPlanRequest {
  string plan_id = 1;
  string reason = 2; // FEEDBACK: delivered to the worker, which revises against it and re-presents
}

message RequestNewPlanRequest {
  string plan_id = 1;   // the ESCALATED plan
  string guidance = 2;  // delivered to the worker as the feedback its fresh plan answers
}

message RequestNewPlanResponse {
  bool requested = 1;
}

message RejectPlanResponse {
  bool rejected = 1;
  // True when this rejection spent the revision budget: the worker stopped and escalated rather than
  // revising again. The UI renders a different card for that, because it needs a human, not a decision.
  bool escalated = 2;
  int32 revisions_remaining = 3;
}

// The always-visible emergency stop (SA-1/F4 + RT-D4). Engage freezes the queue FIRST, then fans out
// yield-all (timeout -> docker pause), then snapshots. Resume clears the freeze.
service KillSwitchService {
  rpc Engage(EngageKillRequest) returns (EngageKillResponse);
  rpc Resume(ResumeKillRequest) returns (ResumeKillResponse);
}

// The coordinator conversation bridge (P2-14 / P2-47 #9). A thin transport over the daemon-side
// CoordinatorAgent tool loop: the human sends a message, the daemon drives the coordinator (which plans
// and delegates via spawn_worker — a plan lands on PlanApprovalService, never a direct spawn), and the
// conversation turns (human / coordinator / tool-call / system) stream back snapshot-then-deltas. This
// service carries NO merge, git, or worktree capability — the coordinator cannot escalate through it.
service CoordinatorService {
  // Snapshot-then-deltas of the conversation turns for a coordinator.
  rpc StreamConversation(StreamConversationRequest) returns (stream ConversationUpdate);
  // Send one operator message; the daemon appends it and drives the coordinator's reply turn(s).
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}

message StreamConversationRequest {
  string coordinator_id = 1; // optional; empty = the default coordinator
}

message ConversationUpdate {
  repeated ConversationTurn turns = 1;
}

message ConversationTurn {
  string role = 1;    // ConversationRole name: Human / Coordinator / ToolCall / SystemLine / PlanCard
  string text = 2;
  string plan_id = 3; // set only on a PlanCard turn (links the pending TaskPlan)
  int64 seq = 4;      // monotonic per-conversation order
}

message SendMessageRequest {
  string coordinator_id = 1; // optional; empty = the default coordinator
  string text = 2;
}

message SendMessageResponse {
  bool accepted = 1;
}

message EngageKillRequest {}

message EngageKillResponse {
  string kill_epoch_id = 1;
  bool queue_frozen = 2;
  int32 agents_yielded = 3;
  int32 agents_paused = 4;
  double deadline_seconds = 5; // the RT-D4 effective deadline (clamped at the fixed ceiling)
}

message ResumeKillRequest {}

message ResumeKillResponse {
  // True only when the WHOLE release succeeded — the freeze cleared AND every jail this kill switch
  // paused was un-paused. It used to mean "the freeze flag was cleared" while every jail stayed frozen
  // forever (ISSUES-LOG #17).
  bool resumed = 1;
  bool queue_unfrozen = 2;      // always true: the freeze clears whatever the unpause fan-out did
  int32 agents_resumed = 3;
  int32 agents_resume_failed = 4; // > 0 means those jails are STILL paused; pressing Resume again retries them
}
