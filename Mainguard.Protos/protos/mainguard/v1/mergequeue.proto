syntax = "proto3";

package mainguard.v1;

option csharp_namespace = "Mainguard.Protos.V1";

// The P2-10 merge-queue surface: the branch-keyed state machine, verification runs, the CanMerge gate,
// and the RT-D1 two-step human merge (BeginMerge → journaled Windows merge → ConfirmMerge). There is
// NO auto-merge RPC by construction — nothing here can move a branch to Merged without the human
// foreground merge confirming it (NoAutoMergePathExists).
service MergeQueueService {
  // Snapshot-then-deltas queue state (per-branch state + main-sha + gate reason).
  rpc StreamQueue(StreamQueueRequest) returns (stream QueueUpdate);
  // Run the configured test command in the agent's sandbox (daemon-observed exit).
  rpc RunVerification(RunVerificationRequest) returns (RunVerificationResponse);
  // The CanMerge gate query (false unless Verified & fresh & no unacknowledged flagged item).
  rpc CanMerge(CanMergeRequest) returns (CanMergeResponse);
  // RT-D1 step 1: take the per-repo merge lease.
  rpc BeginMerge(BeginMergeRequest) returns (BeginMergeResponse);
  // RT-D1 step 3: record the merge outcome, release the lease, fire the stale cascade.
  rpc ConfirmMerge(ConfirmMergeRequest) returns (ConfirmMergeResponse);
  // RT-D1 step 3', the OTHER terminal: hand the lease back WITHOUT recording a merge, for the Windows-side
  // merge that refused or failed (dirty tree, lost CAS, no fast-forward). Strictly weaker than ConfirmMerge
  // by construction — it can only release, never move a branch to Merged and never fire the stale cascade —
  // so it is still true that nothing but the human foreground merge reaches Merged (NoAutoMergePathExists).
  // Without it a refused merge stranded the repo's one lease until the daemon restarted.
  rpc AbandonMerge(AbandonMergeRequest) returns (AbandonMergeResponse);
  // P2-47 #7: the agent-branch-vs-main diff the review cockpit renders (StreamQueue doesn't carry it).
  rpc GetMergeDiff(GetMergeDiffRequest) returns (GetMergeDiffResponse);
  // P2-11 step 4 / RT-D2: acknowledge ONE must-acknowledge flagged item, daemon-side, so a gate the daemon
  // evaluates is a gate a human can actually clear. Item-by-item by construction — there is no
  // "acknowledge all" RPC, exactly as there is no "acknowledge all" method on AcknowledgmentStore.
  rpc AcknowledgeFlaggedChange(AcknowledgeFlaggedChangeRequest) returns (AcknowledgeFlaggedChangeResponse);
  // The human drops an entry from the queue: a TERMINAL `Discarded` transition, recorded with a
  // daemon-derived actor, a timestamp and the human's reason. It is the way out for an entry whose agent
  // is gone — a stopped agent leaves its queue entry behind forever, and until this RPC existed there was
  // no operation of any kind that could act on one.
  //
  // It is not a merge and cannot become one: no lease is taken or confirmed, no stale cascade fires, no
  // T-19 journal entry is written, and the persisted state is `Discarded`, a distinct WorkerMergeState
  // from `Merged` (NoAutoMergePathExists is unaffected — this RPC can only reach a terminal that is not
  // Merged). Denied to the coordinator role at the interceptor, alongside the merge RPCs: an
  // agent-invokable discard is a way for a branch to erase the evidence blocking it.
  rpc DiscardEntry(DiscardEntryRequest) returns (DiscardEntryResponse);
  // Rejects a VERIFIED (or awaiting-review) entry in review — the human judged the work itself and
  // said no. Terminal, like the state machine's Rejected has always been; distinct from DiscardEntry,
  // which is entry housekeeping legal from any non-terminal state. Refused for entries that were never
  // verified ("discard the entry instead"): rejecting is a review verdict, and there is nothing to
  // review before a verification ran.
  rpc RejectEntry(RejectEntryRequest) returns (RejectEntryResponse);
  // Clears a `Verifying` state that has no run behind it, returning the entry to `Working` so it can be
  // verified again. The daemon persists state per transition but tracks in-flight runs in memory, so a
  // restart mid-verification rehydrates `Verifying` with nothing executing — and ResumeAfterRestartAsync
  // has no production caller, so the entry reports "verifying" to a human forever. Refused outright while
  // a run really is executing: the honest answer there is "wait".
  rpc ClearStalledVerification(ClearStalledVerificationRequest) returns (ClearStalledVerificationResponse);
  // The stdout/stderr the entry's last verification actually produced.
  //
  // Until this existed a failed verification was UNREADABLE. The daemon wrote the real output to an
  // artifact file under its own data directory, recorded the path in SQLite, and carried none of it on any
  // wire: QueueEntry had no verification field at all, so the most a human could be shown was a one-line
  // gate reason ("tests failed — node test.js"). A human cannot act on a failure they cannot read, and the
  // only workaround was to open the daemon's database, read a path out of it, and cat the file.
  //
  // It returns CONTENT and never the path. The artifact lives under the daemon's data directory and G-14
  // keeps daemon filesystem paths off the wire; a path would also be useless to a client that is not on
  // the same machine as the daemon. Bounded server-side (see GetVerificationLogResponse.truncated) — a
  // pathological test suite can emit megabytes, and a stream frame is not the place to find that out.
  rpc GetVerificationLog(GetVerificationLogRequest) returns (GetVerificationLogResponse);
  // ---- The two things a human can do about a rebase parked on a conflict --------------------------
  //
  // When a merge moves main, the daemon auto-rebases every co-tenant branch. A rebase that CONFLICTS
  // parks the worktree mid-rebase and `docker pause`s the agent's jail, deliberately — there is no
  // automatic `rebase --abort` (a rejection trigger) — and blocks the queue entry with a reason that
  // names a required human action. Until these two rpcs existed the surface had no operation that could
  // perform it: the jail was paused, so nothing could be exec'd in it, and the entry's only controls were
  // Verify (which cannot run in a paused jail), the verification log, and Discard. A gate reason that
  // asks a human for something the product cannot do is the same defect class as a gate the daemon can
  // evaluate and no human can clear.
  //
  // Neither of these is the T-04 conflict resolver, and neither is a step toward replacing it: T-04 is
  // the staging/diff surface where a human resolves hunks. These are the two operations composable from
  // machinery that already ships — hand it back to the agent that wrote half of it, or undo it.
  //
  // Both are on RoleInterceptor's coordinator denial list: unpausing a co-tenant's jail, steering it, and
  // rewriting its branch's parentage are each merge-adjacent power over work an agent competes with.

  // Unpause the parked jail and instruct the worker to finish resolving its own rebase, through the SAME
  // prompt-delivery path a coordinator's send_worker_prompt uses. Decides nothing about the conflict and
  // touches no index; the branch stays exactly as it was, mid-rebase.
  rpc ResolveConflictWithAgent(ResolveConflictWithAgentRequest) returns (ResolveConflictWithAgentResponse);
  // `git rebase --abort` in the parked worktree, then let the jail run again. The branch returns to its
  // pre-rebase tip (the cycle's `wip: sync` snapshot included) and the entry returns to the queue needing
  // verification against the new main. It loses replay progress and no committed work, which is why it is
  // the deterministic option and why the client puts it behind the same confirmation Discard uses.
  rpc AbortRebase(AbortRebaseRequest) returns (AbortRebaseResponse);
}

message StreamQueueRequest {
  string repo_handle = 1; // opaque repo handle (never a daemon filesystem path, G-14)
}

message QueueUpdate {
  repeated QueueEntry entries = 1;
  string main_sha = 2;
}

message QueueEntry {
  string agent_id = 1;
  string state = 2;              // WorkerMergeState name
  string verified_main_sha = 3;  // the main@sha this branch's verification ran against
  bool can_merge = 4;
  string gate_reason = 5;        // rendered verbatim (§3.4 vocabulary)
  // P2-13 carried-in from P2-12 (additive): the entry origin (MergeEntryOrigin name — Local/External)
  // so the activity list can badge intake'd external-PR entries as such.
  string origin = 6;
  // P2-11 step 4: the must-acknowledge items currently blocking this entry's merge. The gate that owns
  // them is daemon-side, and AcknowledgeFlaggedChange is addressed BY ITEM ID — so without them on the
  // wire the review surface has a blocked branch, a reason string, and no item to acknowledge. That is
  // not a gate, it is a permanently unmergeable branch: the daemon can evaluate it and no human can
  // clear it. Empty for an entry with nothing flagged.
  repeated FlaggedItem flagged_items = 7;
  // Whether a verification run is ACTUALLY executing for this entry right now, as opposed to the row
  // merely saying `Verifying`. The two come apart on every daemon restart (state is persisted per
  // transition; the in-flight set is in-memory), and only the daemon can tell them apart — so without it
  // on the wire a client cannot distinguish a branch being verified from one stuck pretending to be, and
  // therefore cannot offer the human the one action that unsticks it.
  bool verification_in_flight = 8;
  // Whether this entry's agent still HAS a jail in this repo — the fact that decides whether the entry
  // is workable at all. Verification runs in the worker's own sandbox and never on the host, so an entry
  // whose jail is gone cannot be verified, cannot become Verified, and therefore cannot merge; its
  // Verify button is an error message waiting to happen and its only honest actions are Resume and
  // Discard. Only the daemon holds the session table, so a client cannot derive this.
  //
  // `optional` ON PURPOSE, exactly like AgentResourceReading.cpu_percent: proto3 scalars default to
  // false, and a false that means "this daemon does not report liveness" is indistinguishable from one
  // that means "this entry's jail is gone" — which would make every entry served by an older daemon
  // render as stranded. Explicit presence lets "unknown" be a value on the wire, and unknown leaves the
  // surface exactly as it was.
  optional bool has_live_sandbox = 9;
  // ---- The entry's last verification VERDICT (H2/H4) ------------------------------------------------
  //
  // `state` above now distinguishes a red run (`VerificationFailed`) from one that never happened
  // (`Working`), which is the fix for the row being unable to tell them apart. These three carry the
  // FACTS behind that word, because a state name is not a result: which command was run, when, and
  // whether it passed. Without them a client could render "the tests failed" and could not say what was
  // run or how long ago, and had no way to render a PASSING record's provenance either.
  //
  // `optional` on the verdict for the same reason has_live_sandbox is optional: proto3 scalars default to
  // false, and a false meaning "this entry has never been verified" is indistinguishable from one meaning
  // "the tests failed" — which is precisely the conflation H2 exists to end, and reintroducing it on the
  // wire would undo the fix one layer down. Absent means NO RECORD; present means a real verdict.
  optional bool last_verification_passed = 10;
  // The RT-D2 resolved command the record was produced by (empty when there is no record). It is the
  // provenance half of the verdict: a branch that rewrote its own test command produces a green record
  // that means nothing, and the reviewer has to be able to see WHAT passed.
  string last_verification_command = 11;
  // When that record was produced, ISO-8601 round-trip ("O"); empty when there is no record. A verdict
  // with no timestamp cannot be told from a stale one, and a week-old red is a different fact from one
  // that landed thirty seconds ago.
  string last_verification_at = 12;
  // ---- What a human APPROVED for this branch, so the review can be a comparison (13–16) -------------
  //
  // The review surface showed the diff and nothing else. The approved plan's `approach` — the paragraph
  // the human actually said yes to — existed on the daemon, was decided on, and then never appeared
  // again anywhere, so "does this diff match what was approved" was a question the reviewer had no way
  // to ask. Measured: an approved plan said it would keep plain `a / b` because the module had no
  // validation idiom; the branch shipped a throwing validation layer that changed three pre-existing
  // functions. `flagged_items` was EMPTY (the file scope was honoured), `can_merge` was true, and the
  // tests were green because the worker had written them.
  //
  // Empty for an entry with no approved plan (a manual agent, an external-PR head, a worker spawned
  // with plan mode off) — the surface then renders no approval panel at all rather than an empty one,
  // because "nothing was approved" and "an approval with no approach" are different things.
  string approved_plan_id = 13;
  string approved_plan_title = 14;
  string approved_plan_approach = 15;
  // The worker's own commit-time answer about departing from that approach: "NotDeclared" / "None" /
  // "Declared" (DeviationDeclaration name), empty when the entry has no approved plan.
  //
  // THREE values on the wire and not a bool, for the reason the whole mechanism exists: "the worker
  // asserted it followed the approach" and "nobody ever asked it" are different facts, and the review
  // surface has to be able to say which one it is looking at. Declared deviations themselves travel as
  // flagged_items (they are must-acknowledge); this field is what lets the panel render the assertion
  // that produced NO item, and tell it apart from the absence of any answer.
  string deviation_declaration = 16;
  // Present ONLY while this entry's worktree is parked mid-rebase on a conflict — see RebaseConflict.
  // Absent is the ordinary case and means "nothing is parked", which is why it is a message field rather
  // than a set of scalars: a blank path and an empty file list would be indistinguishable from a conflict
  // nobody measured.
  RebaseConflict rebase_conflict = 17;
}

// What the daemon measured about a worktree it parked mid-rebase. The gate reason already told the human
// that a conflict needs them; this is WHERE it is and WHAT conflicts, which is the difference between a
// sentence and something a person can act on.
message RebaseConflict {
  // The parked worktree, verbatim.
  //
  // This is a daemon-side filesystem path, which G-14 keeps off client-facing messages, and it is carried
  // anyway for a stated reason rather than by oversight. G-14's rule is about ADDRESSING: a handle a
  // client uses to name a resource must not be a path, because a path means nothing to a client that is
  // not on the daemon's machine (that is why repo_handle is opaque and why GetVerificationLog returns
  // content instead of a path). This is not an address — no rpc takes it, and nothing is looked up by it.
  // It is a measured fact about a hand-off to a person, and the identical string already reaches a
  // human-facing client verbatim inside AuditService.ReadAudit's decrypted payload for the
  // `keepalive_rebase_conflict` event. Withholding it from the card while shipping it in the audit reader
  // would not be a boundary, only an inconvenience. Clients render it as provenance, never as a link.
  string worktree = 1;
  // The mirror branch the rebase was onto.
  string main_branch = 2;
  // The repo-relative paths git reported as unmerged, measured at parking time (`git diff --name-only
  // --diff-filter=U`) rather than at render time: an agent with a shell in that worktree can `git add` a
  // path out of the unmerged set, and the answer a human reads should be the answer the daemon blocked
  // the entry on. EMPTY MEANS NOT MEASURED, never "no files conflict" — a surface must not render an
  // empty list as reassurance over a real conflict.
  repeated string paths = 3;
  // When the cascade parked it, ISO-8601 round-trip ("O").
  string parked_at = 4;
}

// One must-acknowledge review item (P2-11 §6.3). Mirrors the client-side FlaggedItem projection; the
// id is what AcknowledgeFlaggedChange takes, so client and daemon address the same item by name.
message FlaggedItem {
  string id = 1;           // the ack address (e.g. "changed-test-command")
  string path = 2;         // what the item is about, for the row's first column
  string category = 3;     // risk category name (render hint only)
  string fact = 4;         // the one-sentence claim the human is acknowledging
  bool acknowledged = 5;   // already cleared by a human on the daemon
}

message RunVerificationRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message RunVerificationResponse {
  string agent_id = 1;
  string main_sha = 2;
  bool passed = 3;
  string resolved_command = 4;   // RT-D2 provenance
  string config_hash = 5;        // RT-D2 provenance
  string state = 6;              // resulting WorkerMergeState name
}

message CanMergeRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message CanMergeResponse {
  bool can_merge = 1;
  string reason = 2;
}

message BeginMergeRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message BeginMergeResponse {
  bool granted = 1;
  string lease_id = 2;
  string reason = 3; // when not granted (another merge in progress)
  // The A5 compare-and-swap OLD-OID this lease authorizes: the queue's authoritative main@sha at grant
  // time, which ConfirmMerge will compare against. The Windows-side merge must fast-forward FROM this
  // sha, so it comes from the daemon that granted the lease — never from the client's own cached
  // projection of the queue, which may already be a revision behind.
  string expected_main_sha = 4;
  // K3 — the BRANCH-side half of the identity this lease authorizes: the agent/<id> tip the queue's
  // verification was measured ON (VerificationRecord.BranchSha). expected_main_sha alone says which main
  // may be fast-forwarded and nothing about which commits get fast-forwarded onto it, so the merge could
  // consume a ref the queue never verified and still satisfy the lease. Empty means the daemon has no
  // measured branch sha for this entry (a seeded row, or a record from before the field existed); it is
  // read as "not measured" and never as a mismatch.
  string expected_branch_sha = 5;
}

message AbandonMergeRequest {
  string repo_handle = 1;
  string agent_id = 2;
  string lease_id = 3;
  string reason = 4; // why the Windows-side merge did not land (logged verbatim)
}

message AbandonMergeResponse {
  // False when the named lease was not this repo's outstanding one (already confirmed, already released,
  // or someone else's) — an idempotent no-op, never an error, so a cleanup path can never mask the
  // failure that sent it here.
  bool released = 1;
}

message ConfirmMergeRequest {
  string repo_handle = 1;
  string agent_id = 2;
  string lease_id = 3;
  string new_main_sha = 4;
}

message ConfirmMergeResponse {
  bool confirmed = 1;
}

message AcknowledgeFlaggedChangeRequest {
  string repo_handle = 1;
  string agent_id = 2;
  // The FlaggedChange.Id to acknowledge, or the literal "changed-test-command" for the RT-D2 item, which
  // lives on its own gate rather than in the branch's flagged set.
  string item_id = 3;
}

message AcknowledgeFlaggedChangeResponse {
  bool acknowledged = 1;   // false when the id named no live, unacknowledged item
  bool can_merge = 2;      // the gate re-read after the ack (so the caller needn't round-trip again)
  string reason = 3;       // rendered verbatim when can_merge is false (§3.4 vocabulary)
}

message DiscardEntryRequest {
  string repo_handle = 1;
  string agent_id = 2;
  // The human's reason, recorded verbatim on the entry's row and in the audit event. May be empty — a
  // discard with no stated reason is still a recorded discard, and demanding prose would only produce
  // ".".
  string reason = 3;
  // There is deliberately NO actor field. The discarding identity is derived daemon-side from the
  // connection (IApproverIdentityResolver, the same resolver a plan approval uses) because an
  // attributable record a client can populate is an attribution anyone holding the token can forge.
}

message DiscardEntryResponse {
  bool discarded = 1;
  // Rendered verbatim when discarded is false (already terminal, unknown entry, a merge in progress).
  string reason = 2;
  // The record that was written, echoed back so the surface can say what it did rather than assume.
  string discarded_by = 3;
  string discarded_at = 4; // ISO-8601 (round-trip "O"); empty when nothing was discarded
}

message RejectEntryRequest {
  string repo_handle = 1;
  string agent_id = 2;
  // The reviewer's reason, recorded verbatim on the entry and in the audit event. May be empty, same
  // policy as DiscardEntryRequest.reason.
  string reason = 3;
  // Deliberately NO actor field — the rejecting identity is daemon-derived from the connection
  // (IApproverIdentityResolver), same as DiscardEntry: a client-populated attribution is forgeable.
}

message RejectEntryResponse {
  bool rejected = 1;
  // Rendered verbatim when rejected is false (unknown entry, not verified, already terminal).
  string reason = 2;
  string rejected_by = 3;
  string rejected_at = 4; // ISO-8601 (round-trip "O"); empty when nothing was rejected
}

message ClearStalledVerificationRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message ClearStalledVerificationResponse {
  bool cleared = 1;
  // Verbatim when cleared is false — including the case that matters most, "a verification is running
  // for this entry right now", which is a refusal and not a failure.
  string reason = 2;
  string state = 3; // the resulting WorkerMergeState name
}

message GetVerificationLogRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message GetVerificationLogResponse {
  // False when this entry has no verification record at all — which is a materially different answer from
  // an empty log, and the one the surface must render as "not verified yet" rather than as "the tests
  // printed nothing". Everything below is empty when this is false.
  bool has_record = 1;
  bool passed = 2;
  string resolved_command = 3;
  string main_sha = 4;
  string when = 5;            // ISO-8601 round-trip ("O")
  // The artifact's content — the header the runner writes plus the run's stdout and stderr. Empty with
  // has_record true means the artifact could not be read (deleted, or a daemon whose data directory
  // moved); `unavailable_reason` says which, rather than letting a missing file render as a test suite
  // that produced no output.
  string log = 6;
  // True when `log` is the TAIL of a longer artifact. Named rather than silently elided: a human reading
  // a failure needs to know they are looking at the end of something.
  bool truncated = 7;
  // Verbatim when the record exists and its artifact could not be read. Empty otherwise.
  string unavailable_reason = 8;
}

message ResolveConflictWithAgentRequest {
  string repo_handle = 1;
  string agent_id = 2;
  // Deliberately NO prompt field. The instruction the worker receives is composed daemon-side from what
  // the daemon measured (the branch, the unmerged paths) — a client-supplied prompt on this rpc would be
  // an unlogged way to type arbitrary text into another agent's CLI, which is exactly the power the
  // terminal input lock exists to withhold.
}

message ResolveConflictWithAgentResponse {
  // False when the daemon declined — no parking for this entry, its jail is gone, the rebase already
  // ended, or the instruction could not be delivered. `reason` is rendered verbatim.
  bool handed_back = 1;
  string reason = 2;
}

message AbortRebaseRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message AbortRebaseResponse {
  // False when the daemon declined — no parking, the rebase already ended, the jail could not be
  // quiesced, or `git rebase --abort` itself refused. On every false the worktree is unchanged.
  bool aborted = 1;
  string reason = 2;
}

message GetMergeDiffRequest {
  string repo_handle = 1;
  string agent_id = 2;
}

message GetMergeDiffResponse {
  string branch = 1;        // agent/<id>
  string main_branch = 2;   // the mirror's default branch the diff was taken against
  string unified_diff = 3;  // raw `git diff main...branch`; the client parses it with PatchParser (T-06)
}

// The P2-12 external-PR-intake configuration surface — the queue's other feeder. The intake polls a
// subscribed host repository for bot-authored pull requests and materializes each one as an External
// MergeQueueService entry, so this lives beside the queue it fills.
//
// It is DAEMON-OWNED, and that is the whole reason these RPCs exist. The daemon runs the poll loop and
// provisions the jail each intake'd PR needs; it must still know the cadence and the bot list with the
// App closed. Before this the App's intake settings dialog wrote to an in-process store the daemon never
// read — a settings screen that looked saved and changed nothing. There is now exactly one home for the
// configuration (the daemon's PrIntakeStore) and the App is a client of it.
//
// Unlike every MergeQueueService rpc these carry no repo_handle: intake configuration is daemon-wide.
// Subscriptions name their repository by (host, owner, repo), which is an UPSTREAM identity, not a
// provisioned local one — the daemon matches it against the repos it has provisioned at poll time.
service PrIntakeService {
  // Read the daemon's intake configuration plus its persisted subscriptions (the settings page's load).
  rpc GetPrIntakeSettings(GetPrIntakeSettingsRequest) returns (GetPrIntakeSettingsResponse);
  // Write the daemon's intake configuration. Persisted first, then echoed back AS PERSISTED — clamped
  // and defaulted — so the page renders what the daemon will actually poll with rather than what the
  // user typed. Subscriptions are not touched here; they have their own rpc below.
  rpc UpdatePrIntakeSettings(UpdatePrIntakeSettingsRequest) returns (UpdatePrIntakeSettingsResponse);
  // Subscribe one source. Idempotent on (host, owner, repo, author_filter) — a repeat adds no row and is
  // reported as `added = false`, never an error.
  rpc SubscribePrIntakeSource(SubscribePrIntakeSourceRequest) returns (SubscribePrIntakeSourceResponse);
}

// The daemon's intake configuration. One message for both directions, like GatewayService's Budget.
message PrIntakeSettings {
  // False parks the poll loop: it keeps running and materializes nothing. An off switch that is not
  // "unsubscribe everything", so turning intake back on does not mean re-entering every repository.
  bool enabled = 1;
  // The scheduler cadence. CLAMPED daemon-side to [10, 3600] — a zero here would be a hot loop against a
  // rate-limited host API, and neither a stored row nor a client is a trusted input.
  int32 poll_interval_seconds = 2;
  // The shared bot-author allow-list a source with no author_filter of its own matches against. Empty
  // means "use the daemon's compiled-in default list" — an empty list is far likelier to be a mis-save
  // than a deliberate "poll this repo and ignore every pull request on it".
  repeated string bot_authors = 3;
}

// One subscribed source: a repository on a host, optionally narrowed to a single author.
message PrIntakeSource {
  string host = 1;           // e.g. github.com
  string owner = 2;
  string repo = 3;
  string author_filter = 4;  // empty = fall back to the shared bot_authors list
}

message GetPrIntakeSettingsRequest {}

message GetPrIntakeSettingsResponse {
  PrIntakeSettings settings = 1;
  // The persisted subscriptions, so the settings page's list is the daemon's truth rather than a
  // client-side echo of whatever this session happened to add.
  repeated PrIntakeSource sources = 2;
}

message UpdatePrIntakeSettingsRequest {
  PrIntakeSettings settings = 1;
}

message UpdatePrIntakeSettingsResponse {
  PrIntakeSettings settings = 1; // as persisted (clamped/defaulted), not as requested
}

message SubscribePrIntakeSourceRequest {
  PrIntakeSource source = 1;
}

message SubscribePrIntakeSourceResponse {
  bool added = 1;                        // false = already subscribed (idempotent, not an error)
  repeated PrIntakeSource sources = 2;   // the full persisted list after the add
}
